[package]
name = "optchat"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Append-only chat memory and binary summary tree for pi"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "history"
harness = false
